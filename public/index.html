<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Quant | Predict & Invest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }, 
                    animation: { 
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards'
                    } 
                } 
            }
        }
        if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && !window.matchMedia('(prefers-color-scheme: dark)').matches)) { 
            document.documentElement.classList.remove('dark') 
        } else { 
            document.documentElement.classList.add('dark') 
        }
    </script>
    <style>
        .glass-panel { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: all 0.5s ease-in-out; }
        .glow-button { background-size: 200% 200%; animation: gradientMove 3s ease infinite; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hidden-fade { opacity: 0; pointer-events: none; transform: scale(0.95); position: absolute; }
        .visible-fade { opacity: 1; pointer-events: auto; transform: scale(1); position: relative; }
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 bg-slate-50 dark:bg-[#050810] text-slate-900 dark:text-slate-100 overflow-x-hidden relative font-sans transition-colors duration-500">   
    
    <button onclick="toggleTheme()" class="absolute top-6 right-6 p-3 rounded-full bg-white/50 dark:bg-slate-800/50 backdrop-blur-md border border-slate-200 dark:border-slate-700 shadow-lg hover:scale-110 transition-transform z-50">
        <svg id="theme-icon-sun" class="w-5 h-5 hidden dark:block text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 3.22a1 1 0 011.415 0l.708.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM18 10a1 1 0 01-1-1h-1a1 1 0 110-2h1a1 1 0 011 1zM14.22 15.364a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 18a1 1 0 01-1-1v-1a1 1 0 112 0v1a1 1 0 01-1 1zm-4.22-3.22a1 1 0 01-1.415 0l-.708-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.414zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm3.22-6.78a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 14a4 4 0 100-8 4 4 0 000 8z" clip-rule="evenodd"></path></svg>
        <svg id="theme-icon-moon" class="w-5 h-5 block dark:hidden text-slate-700" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
    </button>

    <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-blue-300/40 dark:bg-blue-600/20 blur-[120px] pointer-events-none animate-pulse-slow"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-emerald-300/30 dark:bg-emerald-600/10 blur-[120px] pointer-events-none"></div>

    <div id="main-card" class="glass-panel w-full max-w-lg rounded-3xl p-8 bg-white/60 dark:bg-slate-900/60 border border-white/40 dark:border-slate-700/50 shadow-2xl z-10 visible-fade">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-emerald-500 dark:from-blue-500 dark:to-emerald-400 mb-2">QUANTUM QUANT</h1>
            <p class="text-blue-600/80 dark:text-blue-400/70 font-mono text-xs uppercase tracking-[0.2em]">Predictive Engine v3.0</p>
        </div>

        <form id="analyze-form" action="/analyze" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-mono text-slate-500 dark:text-slate-400 mb-1 uppercase text-[10px]">Target Asset</label>
                <input type="text" name="ticker" placeholder="TICKER (e.g., AAPL)" required class="w-full bg-white dark:bg-[#0B0F19] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-white focus:ring-1 focus:ring-blue-500 uppercase font-mono shadow-inner">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-mono text-slate-500 dark:text-slate-400 mb-1 uppercase text-[10px]">Monthly In ($)</label>
                    <input type="number" name="income" placeholder="5000" required class="w-full bg-white dark:bg-[#0B0F19] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-white font-mono shadow-inner">
                </div>
                <div>
                    <label class="block text-xs font-mono text-slate-500 dark:text-slate-400 mb-1 uppercase text-[10px]">Monthly Out ($)</label>
                    <input type="number" name="expenses" placeholder="3000" required class="w-full bg-white dark:bg-[#0B0F19] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-white font-mono shadow-inner">
                </div>
            </div>

            <div>
                <label class="block text-xs font-mono text-slate-500 dark:text-slate-400 mb-1 uppercase text-[10px]">Risk Matrix</label>
                <select name="risk" required class="w-full bg-white dark:bg-[#0B0F19] border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-white font-mono shadow-inner">
                    <option value="Low">Alpha (Conservative)</option>
                    <option value="Medium">Beta (Balanced)</option>
                    <option value="High">Gamma (Aggressive)</option>
                </select>
            </div>

            <div class="flex gap-3 mt-6">
                <button type="submit" class="glow-button flex-1 bg-gradient-to-r from-blue-600 to-emerald-500 text-white font-bold text-lg py-4 rounded-xl shadow-lg transition-transform hover:-translate-y-1">
                    INITIALIZE ANALYSIS
                </button>
                <a href="/compare" class="flex-none bg-slate-800 hover:bg-slate-700 border border-slate-600 hover:border-blue-500 text-slate-300 hover:text-white font-mono font-bold text-sm py-4 px-6 rounded-xl transition-all flex items-center justify-center shadow-inner">
                    COMPARE &rarr;
                </a>
            </div>
        </form>
    </div>

    <div id="active-paper-trades" class="w-full max-w-lg mt-8 space-y-4 z-10 relative">
        </div>

    <div id="loading-screen" class="glass-panel w-full max-w-lg rounded-3xl p-8 bg-white/80 dark:bg-slate-900/80 shadow-2xl z-20 hidden-fade flex-col items-center justify-center min-h-[400px]">
        <div class="relative w-24 h-24 mb-8">
            <div class="absolute inset-0 border-t-4 border-blue-500 rounded-full animate-spin"></div>
            <div class="absolute inset-2 border-r-4 border-emerald-500 rounded-full animate-spin direction-reverse" style="animation-duration: 1.5s;"></div>
        </div>
        <h2 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-emerald-500 mb-6 font-mono">SYSTEM ACTIVE</h2>
        <div class="w-full bg-slate-100 dark:bg-black/50 rounded-lg p-4 font-mono text-sm text-emerald-600 dark:text-emerald-400/80 h-32 flex flex-col justify-end overflow-hidden">
            <div id="terminal-output" class="space-y-2"></div>
        </div>
    </div>
    
    <script>
        // 1. Theme Logic
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }

        // 2. Loading Animation
        document.getElementById('analyze-form').addEventListener('submit', function() {
            document.getElementById('main-card').classList.replace('visible-fade', 'hidden-fade');
            document.getElementById('loading-screen').classList.replace('hidden-fade', 'visible-fade');
            
            const steps = ["> Establishing connection...", "> Running regressions...", "> Calculating RSI/MACD...", "> Multi-agent LLM analysis..."];
            const terminal = document.getElementById('terminal-output');
            let delay = 0;
            steps.forEach((step) => {
                setTimeout(() => { 
                    const p = document.createElement('p'); 
                    p.textContent = step; 
                    p.className = "animate-pulse"; 
                    terminal.appendChild(p); 
                }, delay);
                delay += 800;
            });
        });

        // 3. Portfolio State Engine
        async function loadPortfolio() {
            const container = document.getElementById('active-paper-trades');
            if (!container) return;

            try {
                const response = await fetch('/get_portfolio');
                const userAssets = await response.json();

                container.innerHTML = ''; 

                if (userAssets.length === 0) {
                    container.innerHTML = `
                        <div class="glass-panel rounded-2xl p-6 text-center border border-slate-300/30 dark:border-slate-700/30 mt-4 opacity-60">
                            <p class="text-slate-500 dark:text-slate-400 font-mono text-[10px] tracking-wider uppercase">Vault Empty</p>
                            <p class="text-[11px] text-slate-400 mt-2 font-mono italic">Execute a paper trade in the analysis view to see assets here.</p>
                        </div>
                    `;
                    return;
                }

                userAssets.forEach(asset => {
                    const cardHTML = `
                        <div class="glass-panel rounded-2xl p-5 bg-white/40 dark:bg-slate-900/40 border border-white/30 dark:border-slate-700/30 shadow-lg transform transition-all hover:scale-[1.02] animate-fade-in-up">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-black text-xl font-mono text-slate-800 dark:text-white uppercase">${asset.stock}</span>
                                <span class="text-[10px] font-mono text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-md border border-emerald-500/20">ACTIVE UNIT</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mt-4">
                                <div>
                                    <p class="text-[9px] font-mono text-slate-500 dark:text-slate-400 uppercase tracking-tighter">Cost Basis</p>
                                    <p class="font-mono text-lg text-slate-700 dark:text-slate-200">$${asset.buy_price}</p>
                                </div>
                                <div>
                                    <p class="text-[9px] font-mono text-slate-500 dark:text-slate-400 uppercase tracking-tighter">Total Value</p>
                                    <p class="font-mono text-lg text-blue-600 dark:text-blue-400 font-bold">$${asset.total_cost}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });
            } catch (error) {
                console.error("Failed to load portfolio:", error);
            }
        }

        // Initialize view
        document.addEventListener('DOMContentLoaded', loadPortfolio);
    </script>
</body>
</html>
